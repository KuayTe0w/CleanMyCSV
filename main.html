<!DOCTYPE html>
<html>
    <head>
        <title>CleanMyCSV</title>
        <script src="jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="script.js" type="text/javascript"></script>

        <link rel="stylesheet" type="text/css" href="style.css">

    </head>
    <body>
        <table>
            <tr>
                <td><img src="icon.png"></td>
                <td><h1>CleanMyCSV</h1></td>
            </tr>
        </table>
        <div class="section">
            <h2>Upload Data</h2>
            <form id="upload-form" method="POST" enctype="multipart/form-data">
                <table>
                    <tr>
                        <td><input type="file" name="file" id="file" accept=".csv" required></td>
                        <td><td colspan="2"><button type="submit" id="upload-button">Upload</button></td>
                    </tr>
                </table>              
            </form>
        </div>
        <div class="section">
            <h2>Data Preview</h2>
            <div id="preview-wrapper"><table id="preview-table"></table></div>
            <table>
                <tr>
                    <td><button id="page-up"><<<</button></td>
                    <td><button id="page-down">>>></button></td>
                </tr>
            </table>
        </div>
        <div class="section">
            <h2>Data Cleaning</h2>
            <table>
                <tr>
                    <td><button id="add-action">Add Action</button></td>
                    <td><button id="refresh-preview">Refresh Preview</button></td>
                </tr>
            </table>
            <table id="actions-container">
                <tr class="action-row">
                    <td>
                        <select name="column-select" class="column-select">
                            <option value="">Select column</option>
                        </select>
                    </td>
                    <td>
                        <select name="action-select" class="action-select">
                            <option value="">Select action</option>
                            <option value="remove-value">Remove values</option>
                            <option value="fill-value">Fill values</option>
                            <option value="remove-duplicates">Remove duplicates (inop)</option>
                        </select>
                    </td>
                    <td>
                        <div class="option-params">
                            <select name="option-select" class="option-select">
                            </select>
                        </div>
                    </td>
                    <td>
                        <button class="remove-button">&#10060</button>
                    </td>
                </tr>
            </table>
        </div>
        <div class="section">
            <h2>Data Export</h2>
            <table>
                <tr>
                    <td><button id="export-button">Export</button></td>
                    <td><button id="reset-session">Reset Session</button></td>
                </tr>
            </table>
        </div>
    </body>
</html>
